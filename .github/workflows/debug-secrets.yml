name: Debug secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret lengths
        env:
          U: ${{ secrets.VITE_SUPABASE_URL }}
          K: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "URL length: ${#U}"
          echo "KEY length: ${#K}"
          echo "URL starts with https: $([[ $U == https://* ]] && echo yes || echo no)"
          echo "URL ends with supabase.co: $([[ $U == *supabase.co ]] && echo yes || echo no)"
