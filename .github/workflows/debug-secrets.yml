name: Debug secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check key type
        env:
          K: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "KEY length: ${#K}"
          echo "publishable: $([[ $K == sb_publishable_* ]] && echo yes || echo no)"
          echo "secret(НЕЛЬЗЯ!): $([[ $K == sb_secret_* ]] && echo yes || echo no)"
          echo "legacy JWT: $([[ $K == eyJ* ]] && echo yes || echo no)"
